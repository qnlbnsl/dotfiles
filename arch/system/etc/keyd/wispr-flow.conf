# Wispr Flow's uinput virtual keyboard ("Wispr Flow Linux Helper").
#
# The helper re-presses modifiers it thinks you are holding after each paste,
# on its own device, and never releases them (helper uinput.rs chord()); keyd
# would merge those into every app's input as stuck Ctrl/Alt/Super. So drop
# every modifier from this device, and turn its Ctrl into a silent layer that
# only adds Ctrl to the shortcuts the helper actually sends.
#
# Paste becomes Shift+Insert so it works in terminals (where Ctrl+V is a raw ^V)
# as well as GTK/Qt/Chromium/Electron apps.
[ids]
1234:5678

[main]
leftcontrol = layer(wispr_ctrl)
rightcontrol = layer(wispr_ctrl)
leftshift = noop
rightshift = noop
leftalt = noop
rightalt = noop
leftmeta = noop
rightmeta = noop

[wispr_ctrl]
v = S-insert
c = C-c
x = C-x
a = C-a
z = C-z
