; Looking Glass client for the win11 VM (arch/vm). Start with: looking-glass-client
[app]
shmFile=/dev/kvmfr0

[win]
title=Windows
fullScreen=no
jitRender=yes
; Don't ask Hyprland for focus: with focus_on_activate it switched workspace and
; warped the mouse to whichever Windows screen asked, over and over.
requestActivation=no

[input]
; Right Ctrl toggles input capture (Super stays with Hyprland unless captured).
escapeKey=KEY_RIGHTCTRL
rawMouse=yes

[spice]
; Clipboard both ways; audio + mic go through SPICE too.
clipboardToVM=yes
clipboardToLocal=yes

[audio]
micDefault=allow

[wayland]
; Each Windows screen is its own client sharing one Windows cursor; with warping on, the
; client whose screen the cursor lands on yanks the Linux mouse onto its monitor.
; windows-cursor-bridge handles moving between screens instead.
warpSupport=no
