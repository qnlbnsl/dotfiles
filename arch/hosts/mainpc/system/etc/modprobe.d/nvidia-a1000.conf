# Never let the NVIDIA driver, nvidia-modprobe or the NVIDIA libraries create or chmod
# /dev/nvidia*. With the default (1), any root program using NVML/CUDA resets every
# /dev/nvidiaN to 0666, undoing a1000-restrict, and desktop apps then hold the RTX
# A1000 so the Windows VM can't take it. a1000-restrict.service makes the files instead.
# nvidia loads from the initramfs: rebuild it (limine-mkinitcpio) after changing this.
options nvidia NVreg_ModifyDeviceFiles=0
