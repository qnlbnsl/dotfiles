# Built-in Razer Blade keyboard: holding Caps Lock holds Ctrl+Super (Wispr Flow's
# default push-to-talk chord); releasing it releases both. Not oneshot/sticky.
# Shift+Caps Lock still toggles real caps lock.
[ids]
1532:0259

[main]
capslock = layer(wispr_ptt)

[wispr_ptt:C-M]

[shift]
capslock = capslock
