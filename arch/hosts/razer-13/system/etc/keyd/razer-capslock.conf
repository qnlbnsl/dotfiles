# Built-in Razer Blade keyboard: Caps Lock sends F19, Wispr Flow's push-to-talk key
# (F19 + Space is hands-free). F19 is unused by Omarchy and xkb maps it to plain F19,
# so it can't collide with real shortcuts the way the old Ctrl+Super chord did.
# Shift+Caps Lock still toggles real caps lock.
[ids]
1532:0259

[main]
capslock = f19

[shift]
capslock = capslock
