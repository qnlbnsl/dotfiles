# Built-in Razer Blade keyboard: holding Caps Lock holds Ctrl+F19, Wispr Flow's
# push-to-talk (Ctrl+F19+Space is hands-free). Wispr requires a modifier in its
# shortcuts; F19 is unused by Omarchy and xkb maps it to plain F19, so the chord
# can't collide with real shortcuts the way the old Ctrl+Super did.
# Shift+Caps Lock still toggles real caps lock.
[ids]
1532:0259

[main]
capslock = C-f19

[shift]
capslock = capslock
